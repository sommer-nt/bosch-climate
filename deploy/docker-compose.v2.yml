# Version 2 (Gesamtsortiment, geführte Konfiguration) – läuft parallel zur Version 1.
# Gleiches Image, gleiche .env (API-Schlüssel, Passwort), eigener Port und eigenes Compose-Projekt.
# Die App lauscht nur lokal auf 127.0.0.1:${APP_PORT_V2:-8503}; nginx leitet climate.sommer-nt.de dorthin.
# Start:  cd deploy && docker compose -p climate -f docker-compose.v2.yml up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT_V2:-8503}:8501"
    command: ["streamlit", "run", "app_v2.py",
              "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true",
              "--browser.gatherUsageStats=false", "--client.toolbarMode=minimal"]
