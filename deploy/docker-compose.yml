# Split-Klima-Konfigurator mit automatischem HTTPS (Caddy / Let's Encrypt)
# Start:  cd deploy && docker compose up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    expose:
      - "8501"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-klima.sommer-nt.de}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
