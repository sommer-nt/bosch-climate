# Variante für einen vorhandenen nginx-Server (statt Caddy).
# Die App lauscht nur lokal auf 127.0.0.1:${APP_PORT:-8502}; nginx leitet klima.sommer-nt.de dorthin.
# Start:  cd deploy && docker compose -f docker-compose.nginx.yml up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT:-8502}:8501"
