# nginx-Konfiguration für klima.sommer-nt.de → Split-Klima-Konfigurator (Docker, Port 8502)
# Ablage:  /etc/nginx/sites-available/klima.sommer-nt.de
# HTTPS danach mit:  sudo certbot --nginx -d klima.sommer-nt.de
server {
    listen 80;
    listen [::]:80;
    server_name klima.sommer-nt.de;

    # Pläne bis 50 MB hochladen
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;

        # WebSocket – ohne diese Zeilen bleibt die Streamlit-Seite weiß
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # KI-Analyse kann 1–3 Minuten dauern
        proxy_read_timeout 86400;
        proxy_send_timeout 600;
        proxy_buffering off;
    }
}
